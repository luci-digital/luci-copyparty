[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copyparty-mcp-synology"
version = "1.0.0"
description = "Model Context Protocol server for Synology NAS and copyparty management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "copyparty contributors" }
]
keywords = ["mcp", "synology", "nas", "copyparty", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=0.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/9001/copyparty"
Repository = "https://github.com/9001/copyparty"
Issues = "https://github.com/9001/copyparty/issues"

[project.scripts]
copyparty-mcp-synology = "copyparty_mcp_synology.server:main"
